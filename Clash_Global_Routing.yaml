  - DOMAIN,humb.apple.com,Siri-ChatGPT
  - DOMAIN,openai-api.arkoselabs.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,client-api.arkoselabs.com,Siri-ChatGPT
  - DOMAIN,chat.openai.com.cdn.cloudflare.net,Siri-ChatGPT
  - DOMAIN-SUFFIX,openai.com.cdn.cloudflare.net,Siri-ChatGPT
  - DOMAIN,openaicom-api-bdcpf8c6d2e9atf6.z01.azurefd.net,Siri-ChatGPT
  - DOMAIN,openaicomproductionae4b.blob.core.windows.net,Siri-ChatGPT
  - DOMAIN-SUFFIX,openaicom.imgix.net,Siri-ChatGPT
  - DOMAIN-KEYWORD,openaicom-api,Siri-ChatGPT
  - DOMAIN,production-openaicom-storage.azureedge.net,Siri-ChatGPT
  - DOMAIN-SUFFIX,openaiapi-site.azureedge.net,Siri-ChatGPT
  - DOMAIN-SUFFIX,ct.sendgrid.net,Siri-ChatGPT
