# Clash/Mihomo global routing configuration fragment
# 全局分流配置片段：Siri AI / ChatGPT / ChinaMax / Fake-IP filter
# 与现有订阅合并使用；不包含节点，不是 payload 规则集或完整订阅。
# Merge into an existing subscription; not a payload rule set or a full profile.
# 自带 Siri-ChatGPT 策略组，自动收集订阅节点；导入后选择合适节点。
# Siri-ChatGPT collects subscription nodes automatically; select a suitable node after merging.
# 合并 proxy-groups 时保留原策略组；若已有 Siri-ChatGPT，保留一个同名组即可。
# Preserve existing groups when merging; keep only one group named Siri-ChatGPT.
# 合并 rule-providers；追加 DNS 过滤项，保留原 DNS 配置和过滤列表。
# Merge rule-providers; append the DNS filter while preserving existing DNS settings.
# rules 分段合并顺序见下方注释，不要直接覆盖原 rules 列表。
# Follow the rule insertion comments below; do not replace existing rules wholesale.

proxy-groups:
  - name: Siri-ChatGPT
    type: select
    include-all: true

rule-providers:
  ChatGPT-Voice-IP:
    type: inline
    behavior: ipcidr
    format: yaml
    payload:
    - 102.37.57.54/32
    - 13.71.25.29/32
    - 135.220.40.201/32
    - 172.203.39.49/32
    - 172.207.173.200/32
    - 172.214.226.198/32
    - 191.233.251.27/32
    - 20.162.96.163/32
    - 20.168.48.117/32
    - 20.184.36.134/32
    - 20.203.144.245/32
    - 20.74.221.21/32
    - 4.151.200.38/32
    - 4.155.146.196/32
    - 4.197.172.116/32
    - 4.217.235.100/32
    - 4.245.198.13/32
    - 40.118.236.137/32
    - 51.4.112.173/32
    - 52.143.181.161/32
    - 68.155.152.41/32
    - 72.146.20.246/32
    - 74.248.148.7/32
  Siri-AI:
    # Siri_AI_Clash.yaml 仅提供匹配规则；下方 RULE-SET 指定 Siri-ChatGPT 策略。
    # Siri_AI_Clash.yaml supplies matches; RULE-SET below assigns Siri-ChatGPT.
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Leosu16/enableMacSiriAI/main/Siri_AI_Clash.yaml
    path: "./ruleset/Leosu16-Siri_AI_Clash.yaml"
    interval: 86400
  Siri-AI-FakeIP-Filter:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/Leosu16/enableMacSiriAI/main/Siri_AI_FakeIP_Filter.yaml
    path: "./ruleset/Leosu16-Siri_AI_FakeIP_Filter.yaml"
    interval: 86400
  ChinaMax-Classical:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax.yaml
    path: "./ruleset/bm7-ChinaMax.yaml"
    interval: 86400
  ChinaMax-Domain:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_Domain.yaml
    path: "./ruleset/bm7-ChinaMax-Domain.yaml"
    interval: 86400
  ChinaMax-IP:
    type: http
    behavior: ipcidr
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_IP.yaml
    path: "./ruleset/bm7-ChinaMax-IP.yaml"
    interval: 86400
dns:
  fake-ip-filter:
  - rule-set:Siri-AI-FakeIP-Filter

rules:
  # 置顶以下 AI 规则 / Place AI rules first
  - RULE-SET,Siri-AI,Siri-ChatGPT
  - RULE-SET,ChatGPT-Voice-IP,Siri-ChatGPT,no-resolve
  - DOMAIN-SUFFIX,chatgpt.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,openai.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,chat.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,oaistatic.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,oaiusercontent.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,oaistatsig.com,Siri-ChatGPT
  - DOMAIN,ws.chatgpt.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,chatgpt.livekit.cloud,Siri-ChatGPT
  - DOMAIN-SUFFIX,host.livekit.cloud,Siri-ChatGPT
  - DOMAIN-SUFFIX,turn.livekit.cloud,Siri-ChatGPT
  - DOMAIN,cdn.openaimerge.com,Siri-ChatGPT
  - DOMAIN,cdn.workos.com,Siri-ChatGPT
  - DOMAIN,forwarder.workos.com,Siri-ChatGPT
  - DOMAIN,images.workoscdn.com,Siri-ChatGPT
  - DOMAIN,setup.workos.com,Siri-ChatGPT
  - DOMAIN,workos.imgix.net,Siri-ChatGPT
  - DOMAIN,challenges.cloudflare.com,Siri-ChatGPT
  - DOMAIN,humb.apple.com,Siri-ChatGPT
  - DOMAIN,openai-api.arkoselabs.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,client-api.arkoselabs.com,Siri-ChatGPT
  - DOMAIN,chat.openai.com.cdn.cloudflare.net,Siri-ChatGPT
  - DOMAIN-SUFFIX,openai.com.cdn.cloudflare.net,Siri-ChatGPT
  - DOMAIN,openaicom-api-bdcpf8c6d2e9atf6.z01.azurefd.net,Siri-ChatGPT
  - DOMAIN,openaicomproductionae4b.blob.core.windows.net,Siri-ChatGPT
  - DOMAIN-SUFFIX,openaicom.imgix.net,Siri-ChatGPT
  - DOMAIN-KEYWORD,openaicom-api,Siri-ChatGPT
  - DOMAIN,production-openaicom-storage.azureedge.net,Siri-ChatGPT
  - DOMAIN-SUFFIX,openaiapi-site.azureedge.net,Siri-ChatGPT
  - DOMAIN-SUFFIX,ct.sendgrid.net,Siri-ChatGPT
  - DOMAIN-SUFFIX,intercom.io,Siri-ChatGPT
  - DOMAIN-SUFFIX,intercomcdn.com,Siri-ChatGPT
  - DOMAIN,js.stripe.com,Siri-ChatGPT
  - DOMAIN,o207216.ingest.sentry.io,Siri-ChatGPT
  - DOMAIN,o33249.ingest.sentry.io,Siri-ChatGPT
  - DOMAIN,rum.browser-intake-datadoghq.com,Siri-ChatGPT

  # 在这里保留原订阅规则（不含 GEOIP,CN 和 MATCH 兜底）
  # Keep existing subscription rules here, before GEOIP,CN and MATCH.

  # 国内直连：放在原订阅规则后、GEOIP,CN / MATCH 前
  # China direct: after subscription rules, before GEOIP,CN / MATCH
  - RULE-SET,ChinaMax-Classical,DIRECT
  - RULE-SET,ChinaMax-Domain,DIRECT
  - RULE-SET,ChinaMax-IP,DIRECT

  # 在这里保留原配置的 GEOIP,CN 与 MATCH 兜底
  # Keep the original GEOIP,CN and MATCH fallback rules here.
