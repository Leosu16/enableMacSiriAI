# Mihomo 完整配置模板 / Complete Mihomo configuration template
# 1. 将下方 YOUR_CLASH_SUBSCRIPTION_URL 替换为自己的 Clash YAML 节点订阅链接。
# 1. Replace YOUR_CLASH_SUBSCRIPTION_URL below with your Clash YAML subscription URL.
# 2. 保存后作为本地配置导入客户端；在 Siri-ChatGPT 和 Proxy 中选择节点。
# 2. Save and import as a local profile; choose nodes in Siri-ChatGPT and Proxy.
# 3. 使用规则模式，按客户端提示开启 TUN / VPN 接管流量。
# 3. Use rule mode and enable TUN / VPN in your client to route traffic.
# 本模板使用订阅的节点和本文件的分流规则，不继承机场的规则和 DNS 设置。
# Uses subscription nodes with this template's routing and DNS, not the provider's rules.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
profile:
  store-selected: true

tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

proxy-providers:
  Subscription:
    type: http
    url: "YOUR_CLASH_SUBSCRIPTION_URL"
    path: ./proxy_providers/subscription.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: Siri-ChatGPT
    type: select
    use:
      - Subscription
  - name: Proxy
    type: select
    use:
      - Subscription

rule-providers:
  ChatGPT-Voice-IP:
    type: inline
    behavior: ipcidr
    format: yaml
    payload:
    - 102.37.57.54/32
    - 13.71.25.29/32
    - 135.220.40.201/32
    - 172.203.39.49/32
    - 172.207.173.200/32
    - 172.214.226.198/32
    - 191.233.251.27/32
    - 20.162.96.163/32
    - 20.168.48.117/32
    - 20.184.36.134/32
    - 20.203.144.245/32
    - 20.74.221.21/32
    - 4.151.200.38/32
    - 4.155.146.196/32
    - 4.197.172.116/32
    - 4.217.235.100/32
    - 4.245.198.13/32
    - 40.118.236.137/32
    - 51.4.112.173/32
    - 52.143.181.161/32
    - 68.155.152.41/32
    - 72.146.20.246/32
    - 74.248.148.7/32
  Siri-AI:
    # Siri_AI_Clash.yaml 仅提供匹配规则；下方 RULE-SET 指定 Siri-ChatGPT 策略。
    # Siri_AI_Clash.yaml supplies matches; RULE-SET below assigns Siri-ChatGPT.
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/Leosu16/enableMacSiriAI/main/Siri_AI_Clash.yaml
    path: "./ruleset/Leosu16-Siri_AI_Clash.yaml"
    interval: 86400
  Siri-AI-FakeIP-Filter:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/Leosu16/enableMacSiriAI/main/Siri_AI_FakeIP_Filter.yaml
    path: "./ruleset/Leosu16-Siri_AI_FakeIP_Filter.yaml"
    interval: 86400
  ChinaMax-Classical:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax.yaml
    path: "./ruleset/bm7-ChinaMax.yaml"
    interval: 86400
  ChinaMax-Domain:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_Domain.yaml
    path: "./ruleset/bm7-ChinaMax-Domain.yaml"
    interval: 86400
  ChinaMax-IP:
    type: http
    behavior: ipcidr
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax_IP.yaml
    path: "./ruleset/bm7-ChinaMax-IP.yaml"
    interval: 86400
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
  - rule-set:Siri-AI-FakeIP-Filter
  - "*.lan"
  - "*.local"
  - "*.arpa"
  - "time.*.com"
  - "ntp.*.com"

rules:
  # 置顶以下 AI 规则 / Place AI rules first
  - RULE-SET,Siri-AI,Siri-ChatGPT
  - RULE-SET,ChatGPT-Voice-IP,Siri-ChatGPT,no-resolve
  - DOMAIN-SUFFIX,chatgpt.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,openai.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,chat.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,oaistatic.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,oaiusercontent.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,oaistatsig.com,Siri-ChatGPT
  - DOMAIN,ws.chatgpt.com,Siri-ChatGPT
  - DOMAIN-SUFFIX,chatgpt.livekit.cloud,Siri-ChatGPT
  - DOMAIN-SUFFIX,host.livekit.cloud,Siri-ChatGPT
  - DOMAIN-SUFFIX,turn.livekit.cloud,Siri-ChatGPT
  - DOMAIN,cdn.openaimerge.com,Siri-ChatGPT
